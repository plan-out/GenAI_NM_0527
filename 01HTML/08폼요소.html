<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08폼요소</title>
</head>
<body>
  <form action="작성된 데이타를 받을 시스템주소">
    <label>입력폼:</label>
    <input type="text">
    <br><br>
    <label for="">비밀번호 입력폼:</label>
    <input type="password">
    <br><br>
    <input type="button" value="버튼">
    <br><br>
    <input type="submit"><!--전송버튼-->
    <br><br>
    <input type="reset"><!--초기화버튼-->
    <br><br>
    <!--이미지버튼-->
    <input type="image" src="./강아지.jpg">      
    <br><br>  
    <!--체크박스-->
    <input type="checkbox">
    <input type="checkbox">
    <input type="checkbox">
    <br><br>
    <!--라디오버튼-->
    <input type="radio" name="ra">
    <input type="radio" name="ra">
    <input type="radio" name="ra">
    <br><br>
    <textarea cols="30" rows="10"></textarea>
    <br><br>
    <select>
      <option>선택항목1</option>
      <option>선택항목2</option>
      <option>선택항목3</option>
    </select>
    <br><br>
    <button>일반버튼</button>
  </form>  
</body>
</html>
