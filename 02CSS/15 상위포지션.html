<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 상위포지션</title>
  <style>
    #grand{background:#ccc;
      height:400px; width:600px;
      margin:50px;
      position:relative;}

    #parent{width:400px; 
      height:300px;
      background:#6aa;
      position:absolute;
      bottom:20px; right:40px;}  

    #this{background:#f00;
      width:20%; height:10%;
      position:absolute;
      top:10px; right:10px;
    } 
  </style>
</head>
<body>
  <p>상위포지션이란 : 상위요소(조상요소) 중에서 'static'을 제외한
    포지션 속성이 설정된 가장 가까운 요소</p>
  <div id="grand">
    <div id="parent">
      <div id="this"></div>
    </div>
  </div>
</body>
</html>
