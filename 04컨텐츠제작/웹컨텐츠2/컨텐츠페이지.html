<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>컨텐츠페이지</title>

  <!--웹폰트 연결-->
  <link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="inner">
      <h1 id="title">Chef's studio</h1>

      <ul>
        <li>

          <div class="info">

            <h3>이탈리아 셰프에게 직접<br>배우는 파스타 요리</h3>
            <hr>
            <p class="price">1인 35,000원</p>
            <a class="bookmark"><img src="./images/bookmark.svg" alt=""></a>
          </div>  
        </li>
      </ul>
    </section>
  </main>
  <footer>

  </footer>
