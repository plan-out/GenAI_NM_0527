<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muumilaakso – Tampereen taidemuseos</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

  <!-- Slider main container -->
  <div id="main_view" class="swiper">
    <!-- Additional required wrapper -->
    <div class="slider swiper-wrapper">
      <!-- Slides -->
      <div class="view v1 swiper-slide">Slide 1</div>
      <div class="view v2 swiper-slide">Slide 2</div>
      <div class="view v3 swiper-slide">Slide 3</div>
    </div>
    <!-- If we need pagination -->
    <div class="swiper-pagination"></div>

    <!-- If we need navigation buttons -->
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  </div>


  <script>
    const swiper = new Swiper('.swiper', {
      speed: 800,
      loop: true,
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev"
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true
      },
      autoplay: true
    });
  </script>
</body>

</html>
